{% extends "base.html" %}

{% block content %}
<style>
    /* Chat Container Styles */
    .chat-container {
        max-width: 800px;
        margin: 2rem auto;
        padding: 2rem;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        background-color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    h2 {
        color: #2c3e50;
        text-align: center;
        margin-bottom: 1.5rem;
        font-size: 2rem;
    }

    /* Chat Messages Area */
    .chat-messages {
        height: 500px;
        overflow-y: auto;
        padding: 1rem;
        margin-bottom: 1.5rem;
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        background-color: #f9f9f9;
        scroll-behavior: smooth;
    }

    /* Message Bubbles */
    .message {
        margin-bottom: 1rem;
        padding: 0.8rem 1.2rem;
        border-radius: 18px;
        line-height: 1.4;
        max-width: 70%;
        word-wrap: break-word;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .user-message {
        background-color: #007bff;
        color: white;
        margin-left: auto;
        border-bottom-right-radius: 5px;
    }

    .bot-message {
        background-color: #e9ecef;
        color: #333;
        margin-right: auto;
        border-bottom-left-radius: 5px;
    }

    .bot-message a {
        color: #0066cc;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s;
    }

    .bot-message a:hover {
        color: #004499;
        text-decoration: underline;
    }

    .typing {
        color: #6c757d;
        font-style: italic;
    }

    .error {
        color: #dc3545;
    }

    /* Chat Form Styles */
    #chat-form {
        display: flex;
        gap: 0.5rem;
    }

    #chat-form input {
        flex: 1;
        padding: 0.8rem 1rem;
        border: 1px solid #ced4da;
        border-radius: 25px;
        font-size: 1rem;
        outline: none;
        transition: border 0.3s;
    }

    #chat-form input:focus {
        border-color: #007bff;
        box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }

    #chat-form button {
        padding: 0.8rem 1.5rem;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-size: 1rem;
        transition: background-color 0.3s;
    }

    #chat-form button:hover {
        background-color: #0056b3;
    }

    /* Timestamp (optional) */
    .timestamp {
        display: block;
        font-size: 0.7rem;
        color: #6c757d;
        margin-top: 0.3rem;
    }

    /* Scrollbar styling */
    .chat-messages::-webkit-scrollbar {
        width: 8px;
    }

    .chat-messages::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 10px;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
        background: #555;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .chat-container {
            margin: 1rem;
            padding: 1rem;
        }
        
        .chat-messages {
            height: 400px;
        }
        
        .message {
            max-width: 85%;
        }
    }
</style>

<div class="chat-container">
    <h2>Travel Assistant</h2>
    <div class="chat-messages" id="chat-messages">
        {% for message in messages %}
            <div class="message user-message">
                <strong>You:</strong> {{ message.message }}
                <span class="timestamp">{{ message.timestamp.strftime('%H:%M') }}</span>
            </div>
            <div class="message bot-message">
                <strong>Ghoori:</strong> {{ message.response }}
                <span class="timestamp">{{ message.timestamp.strftime('%H:%M') }}</span>
            </div>
        {% endfor %}
    </div>
    <form id="chat-form" method="POST" action="{{ url_for('chatbot') }}">
        <input type="text" name="message" placeholder="Ask me anything about travel..." required autocomplete="off">
        <button type="submit">Send</button>
    </form>
</div>

<script>
    // Auto-scroll to bottom when page loads
    window.addEventListener('DOMContentLoaded', () => {
        const messagesDiv = document.getElementById('chat-messages');
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

    // Simple AJAX for chat
    document.getElementById('chat-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const form = e.target;
        const message = form.message.value.trim();
        
        if (!message) return;
        
        const messagesDiv = document.getElementById('chat-messages');
        const now = new Date();
        const hours = now.getHours().toString().padStart(2, '0');
        const minutes = now.getMinutes().toString().padStart(2, '0');
        
        // Add user message immediately
        messagesDiv.innerHTML += `
            <div class="message user-message">
                <strong>You:</strong> ${message}
                <span class="timestamp">${hours}:${minutes}</span>
            </div>
        `;
        
        // Scroll to bottom
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        
        // Clear input
        form.message.value = '';
        
        // Show typing indicator
        messagesDiv.innerHTML += `
            <div class="message bot-message typing">
                <strong>Ghoori:</strong> Typing...
            </div>
        `;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        
        // Send to server
        fetch(form.action, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'Accept': 'application/json'
            },
            body: `message=${encodeURIComponent(message)}`
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => {
            // Remove typing indicator
            const typingIndicator = document.querySelector('.typing');
            if (typingIndicator) typingIndicator.remove();
            
            // Create a temporary div to parse HTML content
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = data.response;

            // Add the bot message with HTML content
            messagesDiv.innerHTML += `
                <div class="message bot-message">
                    <strong>Ghoori:</strong> ${tempDiv.innerHTML}
                    <span class="timestamp">${hours}:${minutes}</span>
                </div>
            `;

            // Make all links open in new tab
            messagesDiv.querySelectorAll('a').forEach(link => {
                link.setAttribute('target', '_blank');
                link.setAttribute('rel', 'noopener noreferrer');
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        })
        .catch(error => {
            console.error('Error:', error);
            const typingIndicator = document.querySelector('.typing');
            if (typingIndicator) typingIndicator.remove();
            
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            
            messagesDiv.innerHTML += `
                <div class="message bot-message error">
                    <strong>Ghoori:</strong> Sorry, I'm having trouble responding.
                    <span class="timestamp">${hours}:${minutes}</span>
                </div>
            `;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });
    });

    // Auto-focus input field when page loads
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelector('input[name="message"]').focus();
    });
</script>
{% endblock %}
